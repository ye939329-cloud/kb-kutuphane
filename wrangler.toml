name = "ders-calisma-auth"
main = "worker/index.js"
compatibility_date = "2025-03-01"

[[d1_databases]]
binding = "DB"
database_name = "ders-calisma-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Set this to the exact frontend origin(s), comma-separated. Use * only for local testing.
APP_ORIGIN = "https://your-frontend.example"
# Set a verified sender address for Resend; do not put the provider API key here.
EMAIL_FROM = "Ders Çalışma <noreply@example.com>"
# Optional Twilio sender number; credentials belong in Wrangler secrets.
TWILIO_FROM = ""
