<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ders Çalışma Uygulaması</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf5f6;--card:rgba(255,255,255,.92);--ink:#12303a;--mute:#5d7480;--line:#d3e0e3;--pri:#0f5c6e;--pri-ink:#fff;--acc:#e8a317;--ok:#2e8b57;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c21;--card:#16282f;--ink:#e3eef0;--mute:#93aab3;--line:#2a4149;--pri:#4fb3c8;--pri-ink:#06222a;--acc:#f0b73c;--ok:#3f9d68;--bad:#d9604f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1c21;--card:#16282f;--ink:#e3eef0;--mute:#93aab3;--line:#2a4149;--pri:#4fb3c8;--pri-ink:#06222a;--acc:#f0b73c;--ok:#3f9d68;--bad:#d9604f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 0 0,rgba(79,179,200,.18),transparent 34rem),linear-gradient(135deg,var(--bg),#dfecee);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h2{font-size:1.25rem}h3{font-size:1rem}
.card{background:var(--card);border:1px solid rgba(211,224,227,.8);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 26px rgba(18,48,58,.07);backdrop-filter:blur(8px)}
.mute{color:var(--mute);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:120px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.btn{background:linear-gradient(135deg,var(--pri),#187e91);color:var(--pri-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:0 5px 12px rgba(15,92,110,.18);transition:transform .18s,box-shadow .18s,filter .18s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 8px 16px rgba(15,92,110,.24)}
.btn.ghost{background:rgba(255,255,255,.3);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-size:1.35rem}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.86);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5;backdrop-filter:blur(14px);box-shadow:0 -8px 24px rgba(18,48,58,.08)}
nav button{flex:1;max-width:120px;background:none;border:0;border-radius:10px;padding:6px 2px;font-size:.72rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.2rem}
nav button[aria-current="true"]{color:var(--pri);background:rgba(79,179,200,.14);font-weight:800}
.quote{border-left:4px solid var(--acc);padding:4px 0 4px 12px;margin:10px 0}
.quote p{margin:0 0 4px;font-size:1.02rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.list .t{flex:1}
.done .t{text-decoration:line-through;color:var(--mute)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);flex:none;padding:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:640px){.week{grid-template-columns:1fr}}
.day{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:80px}
.day.today{border:2px solid var(--pri)}
.day h3{font-size:.85rem}
.chip{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;margin-top:4px;font-size:.78rem;text-align:left;width:100%}
.chip.done{text-decoration:line-through;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.clock{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:480px){.grid30{grid-template-columns:repeat(5,1fr)}}
.juz{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 0;font-weight:600}
.juz[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.chat{max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{padding:10px 12px;border-radius:14px;max-width:92%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--pri);color:var(--pri-ink)}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sug button{border-radius:20px}
a{color:var(--pri);font-weight:600}
.res{display:block;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.28);transition:transform .18s,background .18s}
.res:hover{transform:translateX(3px);background:rgba(79,179,200,.1)}
.res small{display:block;color:var(--mute);font-weight:400}
.login{max-width:400px;margin:6vh auto 0}
.err{color:var(--bad);min-height:1.3em;font-size:.9rem}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs2 button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.3rem}
.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.media-box{border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--bg)}
.media-box video,.media-box img{display:block;max-width:100%;max-height:280px;margin:10px auto;border-radius:10px}
.video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;margin-top:12px}
.note{border-left:4px solid var(--pri);padding:8px 12px;background:var(--bg);border-radius:0 8px 8px 0}
.password-meter{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.password-meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .2s,background .2s}
.password-status{font-size:.82rem;color:var(--bad);min-height:1.2em;margin-top:4px}
.auth-brand{font-size:2rem;font-weight:800;letter-spacing:-.04em;color:var(--pri);margin-bottom:4px}
.auth-switch{display:flex;gap:6px;margin:14px 0}
.auth-switch button{flex:1}
.requirements{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.82rem}
.requirements b{display:block;margin-bottom:4px}
.requirements span{display:block;color:var(--mute)}
.requirements span.ok{color:var(--ok);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- Görsel tema ---------- */
body{min-height:100vh;background:#07191f;color:#eaf7f8;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(4px);pointer-events:none}
body:before{width:360px;height:360px;top:-150px;right:-100px;background:radial-gradient(circle,rgba(49,190,211,.32),transparent 68%)}
body:after{width:430px;height:430px;bottom:-220px;left:-150px;background:radial-gradient(circle,rgba(232,163,23,.18),transparent 68%)}
.wrap{max-width:980px;padding-top:24px}
.top{padding:18px 20px;margin-bottom:18px;border:1px solid rgba(112,220,232,.16);border-radius:22px;background:linear-gradient(135deg,rgba(18,55,65,.94),rgba(8,31,38,.9));box-shadow:0 16px 38px rgba(0,0,0,.24)}
.top h1{font-size:1.55rem;letter-spacing:-.04em;background:linear-gradient(90deg,#f6ffff,#75d8e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .mute{color:#8ebac1}
.card{background:linear-gradient(145deg,rgba(19,52,61,.96),rgba(11,35,43,.96));border:1px solid rgba(113,211,222,.16);box-shadow:0 14px 32px rgba(0,0,0,.22);color:#eaf7f8}
.card:hover{border-color:rgba(113,211,222,.36);box-shadow:0 18px 38px rgba(0,0,0,.3)}
.mute{color:#91b3ba}
input,select,textarea{background:rgba(4,22,28,.72);border-color:rgba(123,207,216,.2);color:#eaf7f8}
input::placeholder,textarea::placeholder{color:#71949b}
.btn{background:linear-gradient(135deg,#36b8ca,#148095);box-shadow:0 8px 18px rgba(20,128,149,.24)}
.btn.ghost{background:rgba(255,255,255,.035);border-color:rgba(123,207,216,.24);color:#d9f3f5}
.btn.ghost:hover{background:rgba(65,190,207,.12)}
.tabs2{padding:5px;border-radius:14px;background:rgba(0,0,0,.16)}
.tabs2 button[aria-pressed="true"]{background:linear-gradient(135deg,#36b8ca,#148095);box-shadow:0 5px 14px rgba(20,128,149,.25)}
nav{background:rgba(7,25,31,.88);border-top-color:rgba(113,211,222,.2);box-shadow:0 -12px 30px rgba(0,0,0,.3)}
nav button{color:#789da5}
nav button[aria-current="true"]{color:#7ce1eb;background:rgba(54,184,202,.13)}
.stat,.day,.chip,.requirements{background:rgba(4,22,28,.52);border-color:rgba(123,207,216,.14)}
.day.today{border-color:#39bfd0;box-shadow:0 0 18px rgba(57,191,208,.16)}
.quote{background:rgba(232,163,23,.06);border-left-color:#f1b63c}
.opt{background:rgba(4,22,28,.65);border-color:rgba(123,207,216,.18);color:#eaf7f8}
.opt:hover{background:rgba(54,184,202,.13);border-color:#36b8ca;transform:translateX(2px)}
.res{background:rgba(4,22,28,.42);border-color:rgba(123,207,216,.18);color:#eaf7f8}
.note{background:rgba(54,184,202,.08)}
.media-box{background:rgba(4,22,28,.4);border-color:rgba(123,207,216,.24)}
.auth-brand{background:linear-gradient(90deg,#36b8ca,#f1b63c);-webkit-background-clip:text;background-clip:text;color:transparent}
.login{margin-top:8vh}
@media (max-width:640px){.wrap{padding:12px 10px 100px}.top{padding:15px;border-radius:18px}.top h1{font-size:1.3rem}.card{padding:14px;border-radius:16px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ---------- Depolama: hesabına bağlı özel veritabanı (yoksa yalnızca bu cihaz) ---------- */
var mem = {}, DB = null, VID = null, P = null, D = null, user = null;
var SUPPORT_EMAIL = "iletisim.kbkutuphane@gmail.com";
var API_BASE = String(window.DCA_API_BASE || "https://kb-kutuphane-api.kocabogayunis02.workers.dev").replace(/\/+$/,""), IS_STATIC_PAGES = /\.github\.io$/i.test(location.hostname), USE_API = !!API_BASE || (!IS_STATIC_PAGES && (location.protocol === "http:" || location.protocol === "https:")), pendingAuth = null;
function lsGet(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k] || null); } catch(e){ return mem[k] || null; } }
function lsSet(k,v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function lsDel(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
async function initStore(){
  try { if(typeof claude === "undefined") return; DB = await claude.use("db"); var u = await claude.use("user"); if(DB && u) VID = await u.id(); if(!VID) DB = null; } catch(e){ DB = null; }
}
function adminView(){
  $app.innerHTML = '<div class="top"><div><h1>Yönetici paneli</h1><span class="mute">Ayrı yönetici bağlantısı</span></div><button class="btn ghost sm" id="adminOut">Çıkış</button></div><main>'+
   '<div class="card"><h2>Yönetici erişimi</h2><p class="note"><b>Güvenlik notu:</b> Bu HTML dosyası tek başına gerçek bir yönetim sunucusu değildir. Kullanıcı listesi, rol kontrolü, e-posta doğrulama ve telefon OTP işlemleri için backend kimlik doğrulaması bağlanmalıdır.</p>'+
   '<p>Yönetici hesabı yalnızca sunucu tarafında oluşturulmuş hesaplarla giriş yapabilir. İstemciye yönetici parolası gömülmemiştir.</p></div>'+
   '<div class="card"><h2>Hesap bilgisi</h2><div class="stats"><div class="stat"><b>Yönetici</b><span class="mute">Rol</span></div><div class="stat"><b>'+esc(P && P.contact || "—")+'</b><span class="mute">Giriş hesabı</span></div></div></div>'+
   '<div class="card"><h2>Kullanıcılar</h2><div id="adminUsers"><p class="mute">Yükleniyor…</p></div></div></main>';
  document.getElementById("adminOut").onclick = logout;
  fetch(API_BASE+"/api/admin/users",{headers:{Authorization:"Bearer "+(lsGet("dca_api_token")||"")}}).then(function(r){ return r.json(); }).then(function(data){ document.getElementById("adminUsers").innerHTML=(data.users||[]).map(function(u){ return '<div class="list"><div><b>'+esc(u.name)+'</b><br><span class="mute">'+esc(u.email||u.phone||"—")+' · '+esc(u.role)+'</span></div></div>'; }).join("")||'<p class="mute">Kullanıcı bulunamadı.</p>'; }).catch(function(){ document.getElementById("adminUsers").innerHTML='<p class="err">Kullanıcılar yüklenemedi.</p>'; });
}
async function sGet(key){
  if(DB){ try { var s = await DB.doc("data/users/"+VID+"/"+key).get(); return s.exists ? s.data() : null; } catch(e){} }
  return lsGet("dca_"+key);
}
async function sSet(key,val){
  if(DB){ try { await DB.doc("data/users/"+VID+"/"+key).set(val); return; } catch(e){} }
  lsSet("dca_"+key, val);
}
var saveT = null, saving = false, dirty = false;
function save(){ dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 500); }
async function flush(){
  if(saving){ saveT = setTimeout(flush, 500); return; }
  if(!P || !dirty) return; dirty = false; saving = true;
  try { await sSet(P.key, P); } finally { saving = false; }
}
document.addEventListener("visibilitychange", function(){ if(document.hidden && P){ dirty = true; flush(); } });

var DAYS = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
var tab = "plan", sub = "gun", rsub = "kay", sp = 0, loginMode = "student", accountMode = "login", admin = false;
var loginGuard = { fails:0, until:0 };
var $app = document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^[*-] /gm,"• "); }
function today(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayIdx(){ return (new Date().getDay()+6)%7; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function hm(min){ var h = Math.floor(min/60), m = Math.round(min%60); return h ? h+" sa "+m+" dk" : m+" dk"; }
async function sha(s){ var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,"0"); }).join(""); }
function newData(){ return { prog:[], todos:[], hatim:{juz:[],count:0}, log:{}, steps:{}, coach:{goal:"",focus:"",reflection:""}, dailySeed:{}, points:0, badges:[], reminders:{water:false,stretch:false,sleep:false} }; }
function award(points, badge){
  D.points = (D.points||0) + points;
  D.badges = D.badges || [];
  if(badge && D.badges.indexOf(badge)<0) D.badges.push(badge);
  save();
}
var reminderMinute = "";
function checkReminders(){
  if(!D || !D.reminders) return;
  var now = new Date(), minute = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  if(minute===reminderMinute) return;
  reminderMinute = minute;
  var message = D.reminders.water && now.getMinutes()===0 ? "Bir bardak su içme zamanı.":D.reminders.stretch && now.getMinutes()===30 ? "Kısa bir esneme ve göz molası ver.":D.reminders.sleep && minute==="22:00" ? "Uyku hazırlığına başlama zamanı." :"";
  if(message && "Notification" in window && Notification.permission==="granted") new Notification("Ders Çalışma", {body:message});
}
setInterval(checkReminders, 60000);

/* ---------- Sınıfa göre kurgu (4-12) ---------- */
function lv(g){
  var base = ["Türkçe","Matematik","Fen Bilimleri","Sosyal Bilgiler","İngilizce","Din Kültürü ve Ahlak Bilgisi"];
  if(g===8) base = ["Türkçe","Matematik","Fen Bilimleri","T.C. İnkılap Tarihi ve Atatürkçülük","İngilizce","Din Kültürü ve Ahlak Bilgisi"];
  var L = { subj: base, pomos: [20,30,40,5], goal: [90,"1,5-2 saat"], sleep: "8-10 saat", cyc: [6,5,4], ad: "ortaokul", ex: "Her 20 dakikada kısa bir mola ver." };
  if(g===4){ L.pomos = [15,20,25,5]; L.goal = [45,"45-60 dakika"]; L.sleep = "9-12 saat"; L.cyc = [7,6,5]; L.ad = "ilkokul"; L.ex = "Çalışmayı 15-20 dakikalık parçalara böl."; }
  else if(g<=6){ L.goal = [60,"1-1,5 saat"]; L.sleep = "9-12 saat"; L.cyc = [7,6,5]; }
  else if(g===8){ L.goal = [120,"2-3 saat (LGS hazırlığı)"]; L.ad = "LGS yılı"; }
  else if(g>=9){
    L.subj = ["Matematik","Fizik","Kimya","Biyoloji","Türk Dili ve Edebiyatı","Tarih","Coğrafya","İngilizce","Din Kültürü ve Ahlak Bilgisi"];
    if(g>=10) L.subj.push("Felsefe");
    L.pomos = [25,45,50,5]; L.ad = "lise"; L.ex = "Konu çalış, ardından soru çöz ve yanlışlarını not et.";
    L.goal = g===9 ? [120,"2-3 saat"] : g===10 ? [150,"2,5-3,5 saat"] : g===11 ? [180,"3-4 saat"] : [240,"4-6 saat (YKS hazırlığı)"];
    if(g===12){ L.subj.push("TYT Denemesi","AYT Denemesi"); L.ad = "YKS yılı"; }
  }
  return L;
}

/* ---------- Giriş ---------- */
async function hash(pin, salt){ return sha(salt+":"+pin); }
function loginView(){
  var isAdmin = loginMode==="admin", isRegister = !isAdmin && accountMode==="register";
  $app.innerHTML = '<div class="card login"><div class="auth-brand">Ders Çalışma</div><h1>'+(isAdmin?"Yönetici girişi":(isRegister?"Hesap oluştur":"Hoş geldin"))+'</h1><p class="mute">'+(isAdmin?"Yönetici paneline ayrı bağlantıdan gir.":(isRegister?"Ücretsiz öğrenci hesabını oluştur.":"Ders planına devam etmek için giriş yap."))+'</p>'+
  '<div class="auth-switch">'+(isAdmin?'<a class="btn ghost sm" href="#" id="studentMode">Öğrenci girişine dön</a>':'<button class="btn ghost sm" id="loginModeBtn" aria-pressed="'+(!isRegister)+'">Giriş yap</button><button class="btn ghost sm" id="registerModeBtn" aria-pressed="'+isRegister+'">Hesap aç</button><a class="btn ghost sm" href="#yonetici" id="adminMode">Yönetici</a>')+'</div>'+
  (isAdmin ? '<p><input id="contact" placeholder="Yönetici e-posta veya telefon" autocomplete="username"></p>' :
  (isRegister?'<div class="row"><input id="ad" class="grow" placeholder="Ad" autocomplete="given-name"><input id="soyad" class="grow" placeholder="Soyad" autocomplete="family-name"></div>':'')+
  '<p><input id="contact" placeholder="'+(isRegister?"E-posta veya telefon (isteğe bağlı)":(isAdmin?"Yönetici e-posta veya telefon":"Ad soyad"))+'" autocomplete="username"></p>'+

function normalizeEmail(v){ return v.trim().toLocaleLowerCase("tr"); }
function normalizeContact(v){ var x = v.trim().toLocaleLowerCase("tr").replace(/[\s()-]/g,""); return /^0\d{10}$/.test(x) ? "+90"+x.slice(1) : x; }
function validContact(v){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || /^\+?\d{10,15}$/.test(normalizeContact(v)); }
function passwordScore(p){
  var score = 0;
  if(p.length>=8) score++;
  if(/[a-z]/.test(p)) score++;
  if(/[A-Z]/.test(p)) score++;
  if(/\d/.test(p)) score++;
  if(/[^A-Za-z0-9]/.test(p)) score++;
  return score;
}
function updatePasswordMeter(p){
  var score = passwordScore(p), bar = document.getElementById("pwBar"), status = document.getElementById("pwStatus");

  bar.style.width = (score*20)+"%";
  bar.style.background = score<=2 ? "var(--bad)" : score<5 ? "var(--acc)" : "var(--ok)";
  status.textContent = !p ? "" : score<=2 ? "Güçsüz parola" : score<5 ? "Orta seviye parola — tüm koşulları tamamla" : "Güçlü parola";
  status.style.color = score<=2 ? "var(--bad)" : score<5 ? "var(--acc)" : "var(--ok)";
  [["rLen",p.length>=8],["rLow",/[a-z]/.test(p)],["rUp",/[A-Z]/.test(p)],["rNum",/\d/.test(p)],["rSpec",/[^A-Za-z0-9]/.test(p)]].forEach(function(x){ var el=document.getElementById(x[0]); if(el){ el.classList.toggle("ok",x[1]); el.textContent=(x[1]?"✓ ":"○ ")+el.textContent.replace(/^[✓○] /,""); } });
}
function validPassword(p){ return p.length>=8 && /[a-z]/.test(p) && /[A-Z]/.test(p) && /\d/.test(p) && /[^A-Za-z0-9]/.test(p); }
function apiContact(value){ return value.indexOf("@")>-1 ? {email:normalizeEmail(value),phone:null,type:"email"} : {email:null,phone:normalizePhone(value),type:"phone"}; }

async function backendLogin(contact, password, name, grade){

async function doLogin(){
  var contact = document.getElementById("contact").value.trim(), pin = document.getElementById("pin").value, err = document.getElementById("err");
  var isRegister = loginMode==="student" && accountMode==="register";
  if(Date.now()<loginGuard.until){ err.textContent = "Çok fazla hatalı deneme. Birkaç dakika sonra tekrar dene."; return; }
  if(isRegister && (!document.getElementById("ad").value.trim() || !document.getElementById("soyad").value.trim())){ err.textContent = "Ad ve soyad gerekli."; return; }
  if(isRegister && contact && !validContact(contact)){ err.textContent = "E-posta veya telefon boş bırakılabilir; yazarsan geçerli olmalı."; return; }
  if(!isRegister && !contact){ err.textContent = loginMode==="admin" ? "Yönetici e-posta veya telefon gerekli." : "Ad soyad gerekli."; return; }
  if(!isRegister && loginMode==="admin" && !validContact(contact)){ err.textContent = "Geçerli bir e-posta veya telefon yaz."; return; }
  if(!validPassword(pin)){ err.textContent = "Parola en az 8 karakter olmalı; büyük harf, küçük harf, rakam ve özel karakter içermeli."; return; }
  if(USE_API){
    try {
      if(isRegister){ var c=contact ? apiContact(contact) : {email:null,phone:null}; var accountName=document.getElementById("ad").value.trim()+" "+document.getElementById("soyad").value.trim(); await apiRequest("/auth/register",{name:accountName,email:c.email,phone:c.phone,password:pin}); await backendLogin(accountName,pin,accountName,+document.getElementById("gr").value); }
      else await backendLogin(contact,pin,loginMode==="admin"?"Yönetici":"",loginMode==="admin"?12:4);
    }
    catch(e){ err.textContent = e.message || "Sunucuya bağlanılamadı."; }
    return;
  }
  var key = (loginMode==="admin"?"admin_":"p_")+(await sha(normalizeContact(contact))).slice(0,20);
  var p = await sGet(key);
  if(!p){
    if(loginMode==="admin"){ err.textContent = "Yönetici hesabı bulunamadı. İlk yönetici hesabını sunucu tarafında oluşturmalısın."; return; }
    var salt = uid()+uid();
    if(!isRegister){ err.textContent = "Hesap bulunamadı. Önce Hesap aç seçeneğini kullan."; return; }
    p = { key:key, name:document.getElementById("ad").value.trim()+" "+document.getElementById("soyad").value.trim(), contact:normalizeContact(contact), salt:salt, hash:await hash(pin,salt), grade:+document.getElementById("gr").value, data:newData() };
    await sSet(key, p);
  } else if(p.hash !== await hash(pin, p.salt)){
    loginGuard.fails++; if(loginGuard.fails>=5){ loginGuard.until = Date.now()+5*60*1000; loginGuard.fails = 0; err.textContent = "Çok fazla hatalı deneme. 5 dakika bekle."; } else err.textContent = "Parola yanlış.";
    return;
  }
  loginGuard.fails = 0; loginGuard.until = 0;
  lsSet("dca_session", key); admin = loginMode==="admin"; start(p);
}

/* ---------- Zamanlayıcı ---------- */
var T = { mode:"sw", run:false, acc:0, last:0, target:25*60000, iv:null };
function tick(){
  var now = Date.now(), d = now - T.last; T.last = now; T.acc += d;
  D.log[today()] = (D.log[today()]||0) + d/1000;
  if(T.mode==="cd" && T.acc >= T.target){ T.acc = T.target; finishTimer(); }
  var el = document.getElementById("clock"); if(el) el.textContent = fmt(T.mode==="cd" ? (T.target-T.acc)/1000 : T.acc/1000);
  var st = document.getElementById("todaySt"); if(st) st.textContent = hm((D.log[today()]||0)/60);
}
function startTimer(){ if(T.run) return; T.run = true; T.last = Date.now(); T.iv = setInterval(tick, 250); updTimerBtns(); }
function stopTimer(){ if(T.iv) clearInterval(T.iv); T.iv = null; if(T.run){ T.run = false; if(D) save(); } updTimerBtns(); }
function resetTimer(){ stopTimer(); T.acc = 0; var el = document.getElementById("clock"); if(el) el.textContent = fmt(T.mode==="cd" ? T.target/1000 : 0); updTimerBtns(); }
function finishTimer(){
  stopTimer();
  try { var c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); setTimeout(function(){ o.stop(); }, 700); } catch(e){}
  try { navigator.vibrate && navigator.vibrate(300); } catch(e){}
  var m = document.getElementById("tmsg"); if(m) m.textContent = "Süre doldu. Kısa bir mola ver.";
}

   '<div class="card"><h3>Destek ve şikâyet</h3><p class="mute">Güvenlik veya kullanım sorunlarını şu adrese bildir:</p><a href="mailto:'+SUPPORT_EMAIL+'?subject=Uygulama%20deste%C4%9Fi">'+SUPPORT_EMAIL+'</a></div>';

/* ---------- Ders Asistanı ---------- */
var chat = [], aiMode = "metin", cameraStream = null;
function aiView(m){
  var L = lv(P.grade);
  m.innerHTML = '<div class="card"><h2>Ders Asistanı</h2><p class="mute">'+P.grade+'. sınıf düzeyinde metin, ses ve görüntü desteği. Sesli ve görüntülü araçlar ayrı çalışır.</p>'+
   '<div class="tabs2"><button class="btn ghost sm" data-ai="metin" aria-pressed="'+(aiMode==="metin")+'">Yazılı sohbet</button><button class="btn ghost sm" data-ai="ses" aria-pressed="'+(aiMode==="ses")+'">Sesli konuşma</button><button class="btn ghost sm" data-ai="goruntu" aria-pressed="'+(aiMode==="goruntu")+'">Kamera / görüntü</button></div>'+
   '<div id="aiPanel"></div><p class="err" id="aerr"></p></div>';
  m.querySelectorAll("[data-ai]").forEach(function(b){ b.onclick = function(){ aiMode = b.dataset.ai; render(); }; });
  if(aiMode==="ses"){ voicePanel(document.getElementById("aiPanel")); return; }
  if(aiMode==="goruntu"){ imagePanel(document.getElementById("aiPanel")); return; }
  document.getElementById("aiPanel").innerHTML = '<div class="chat" id="ch" aria-live="polite"></div>'+
   '<div class="sug">'+["Uygulama nasıl kullanılır?","Bugün ne yapmalıyım?","Kısa bir motivasyon sözü söyle","Ders çalışma molası öner"].map(function(s){ return '<button class="btn ghost sm" data-sg="'+esc(s)+'">'+esc(s)+'</button>'; }).join("")+'</div>'+
   '<div class="row"><textarea id="q" rows="2" class="grow" placeholder="Sorunu yaz" aria-label="Sorun"></textarea><button class="btn" id="send">Gönder</button></div>';
  var ch = document.getElementById("ch");
  function paint(){ ch.innerHTML = chat.length ? chat.map(function(c){ return '<div class="msg '+(c.role==="user"?"u":"a")+'">'+(c.role==="user"?esc(c.content):md(c.content||"…"))+'</div>'; }).join("") : '<p class="mute">Merhaba! Ne çalışmak istersin?</p>'; ch.scrollTop = ch.scrollHeight; }
  paint();
  async function send(text){
    var q = document.getElementById("q"), er = document.getElementById("aerr"); text = (text || q.value).trim(); if(!text) return;
    er.textContent = ""; q.value = ""; chat.push({role:"user", content:text});
    var msgs = chat.slice(-10).map(function(c){ return {role:c.role, content:c.content}; }); if(msgs[0].role!=="user") msgs.shift();
    msgs[0] = {role:"user", content:"Sen “Ders Asistanı” adlı kısa ve sıcak bir Türkçe arkadaş asistanısın. Karşındaki öğrenci Türkiye’de "+P.grade+". sınıfta ("+L.ad+"). Yalnızca uygulamanın kullanımı, günlük çalışma düzeni, motivasyon, mola, spor ve dengeli beslenme hakkında kısa cevaplar ver. Ders sorusu çözme, ödev yapma, uzun konu anlatımı veya derin analiz yapma; kullanıcı ders sorusu sorarsa Kaynaklar > Örnek sorular bölümüne yönlendir. En fazla 3 kısa cümle yaz, samimi ol ve tıbbi konularda doktora yönlendir.\n\n"+msgs[0].content};
    var reply = {role:"assistant", content:""}; chat.push(reply); paint();
    try {
      var sample = typeof claude !== "undefined" ? await claude.use("sample") : null;
      if(!sample){ reply.content = offlineAssistantReply(text); paint(); return; }
      var r = await sample(msgs, { cache:false, onText:function(x){ reply.content = x.text; paint(); } });
      reply.content = r.text; paint();
    } catch(e){
      chat.pop(); paint();
      er.textContent = e && e.code==="not_granted" ? "Asistanı kullanmak için izin vermelisin." : e && e.code==="rate_limited" ? "Çok fazla istek gönderildi. Biraz bekleyip tekrar dene." : "Yanıt alınamadı. Tekrar dene.";
    }
  }
  document.getElementById("send").onclick = function(){ send(); };
  document.getElementById("q").onkeydown = function(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } };
  m.querySelectorAll("[data-sg]").forEach(function(b){ b.onclick = function(){ send(b.dataset.sg); }; });
}

function voicePanel(v){
  var Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  v.innerHTML = '<div class="media-box"><p>Konuşmak için mikrofon düğmesine bas. Metin, yalnızca sen gönderdiğinde asistana iletilir.</p><button class="btn" id="mic" '+(Speech?"":"disabled")+'>🎙️ Dinlemeyi başlat</button><p id="vt" class="mute">Hazır</p><textarea id="vq" rows="3" placeholder="İstersen konuşma metnini burada düzenle" aria-label="Sesli soru"></textarea><button class="btn" id="vs">Asistana gönder</button></div>';
  var mic = document.getElementById("mic"), out = document.getElementById("vt"), q = document.getElementById("vq");
  if(!Speech) out.textContent = "Bu tarayıcı ses tanımayı desteklemiyor; metin alanını kullanabilirsin.";
  if(Speech) mic.onclick = function(){
    var r = new Speech(); r.lang = "tr-TR"; r.interimResults = false;
    out.textContent = "Dinleniyor…"; r.onresult = function(e){ q.value = e.results[0][0].transcript; out.textContent = "Metin alındı."; };
    r.onerror = function(){ out.textContent = "Mikrofon kullanılamadı; izinleri kontrol et."; }; r.onend = function(){ if(out.textContent==="Dinleniyor…") out.textContent = "Dinleme bitti."; }; r.start();
  };
  document.getElementById("vs").onclick = async function(){
    var text = q.value.trim(), er = document.getElementById("aerr"), b = this; if(!text) return;
    b.disabled = true; er.textContent = "";
    try {
      var sample = typeof claude !== "undefined" ? await claude.use("sample") : null; if(!sample) throw new Error("unavailable");
      var r = await sample([{role:"user",content:"Sen "+P.grade+". sınıf öğrencisine koçluk yapan Türkçe ders asistanısın. Kısa, yaşa uygun ve adım adım yanıt ver: "+text}],{cache:false});
      if(window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(r.text));
      out.textContent = r.text;
    } catch(e){ er.textContent = "Sesli yanıt alınamadı. Yazılı sohbeti deneyebilirsin."; }
    finally { b.disabled = false; }
  };
}

function imagePanel(v){
  v.innerHTML = '<div class="media-box"><p>Bir sorunun fotoğrafını seç veya kamerayı aç. Görüntü önizlenir; inceleme düğmesine basmadan asistana iletilmez.</p><input id="im" type="file" accept="image/*" aria-label="Görüntü seç"><button class="btn ghost" id="cam">Kamerayı aç</button><button class="btn ghost" id="snap" hidden>Kareyi yakala</button><video id="vid" autoplay playsinline hidden></video><canvas id="can" hidden></canvas><img id="prev" alt="Seçilen görüntü" hidden><p><input id="iq" placeholder="Bu görüntü hakkında ne sorayım?" maxlength="160" aria-label="Görüntü sorusu"></p><button class="btn" id="ia">Görüntüyü incele</button><p id="it" class="mute"></p></div>';
  var input = document.getElementById("im"), img = document.getElementById("prev"), video = document.getElementById("vid"), snap = document.getElementById("snap"), canvas = document.getElementById("can"), status = document.getElementById("it"), imageData = "";
  input.onchange = function(){ if(input.files[0]){ var reader = new FileReader(); reader.onload = function(){ imageData = reader.result; img.src = imageData; img.hidden = false; video.hidden = true; status.textContent = "Görüntü hazır."; }; reader.readAsDataURL(input.files[0]); } };
  document.getElementById("cam").onclick = async function(){
    try { cameraStream = await navigator.mediaDevices.getUserMedia({video:true}); video.srcObject = cameraStream; video.hidden = false; snap.hidden = false; img.hidden = true; status.textContent = "Kamera açık. Kareyi yakalayabilirsin."; }
    catch(e){ status.textContent = "Kamera açılamadı; tarayıcı iznini kontrol et."; }
  };
  snap.onclick = function(){ if(!video.videoWidth) return; canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext("2d").drawImage(video,0,0); imageData = canvas.toDataURL("image/jpeg",.85); img.src = imageData; img.hidden = false; video.hidden = true; status.textContent = "Kare yakalandı."; };
  document.getElementById("ia").onclick = async function(){
    var er = document.getElementById("aerr"), question = document.getElementById("iq").value.trim() || "Bu soruyu adım adım açıklar mısın?";
    if(!imageData){ er.textContent = "Önce bir görüntü seç veya kameradan kare yakala."; return; }
    er.textContent = "Görüntü hazırlanıyor…";
    try {
      var sample = typeof claude !== "undefined" ? await claude.use("sample") : null; if(!sample) throw new Error("unavailable");
      var comma = imageData.indexOf(","), media = comma>-1 ? imageData.slice(5,comma) : "image/jpeg", encoded = comma>-1 ? imageData.slice(comma+1) : imageData;
      var r = await sample([{role:"user",content:[{type:"text",text:"Sen "+P.grade+". sınıf Türkçe ders koçusun. "+question},{type:"image",source:{type:"base64",media_type:media,data:encoded}}]}],{cache:false});
      status.textContent = r.text; er.textContent = "";
    } catch(e){ er.textContent = "Görüntü analizi bu ortamda kullanılamadı. Görseldeki soruyu yazılı asistana aktarabilirsin."; }
  };
}

/* ---------- Manevi destek ---------- */
function spiritView(m){
  var i = dailyIdx()+sp, a = AYET[i%AYET.length], h = HADIS[(i*3+1)%HADIS.length], H = D.hatim, n = H.juz.length, pct = Math.round(n/30*100);
  m.innerHTML = '<div class="card"><h2>Günün ayeti ve hadisi</h2><div class="quote"><p>“'+esc(a[0])+'”</p><span class="mute">'+esc(a[1])+' (meal)</span></div><div class="quote"><p>“'+esc(h[0])+'”</p><span class="mute">'+esc(h[1])+'</span></div><button class="btn ghost sm" id="nx">Başka göster</button><p class="mute" style="margin-top:8px">'+AYET.length+' ayet ve '+HADIS.length+' hadis arasından seçilir; her gün değişir.</p></div>'+
   '<div class="card"><h2>Hatim takibi</h2><p class="mute">Okuduğun cüzleri işaretle. Tamamlanan hatim: <b>'+H.count+'</b></p><div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100" style="margin:8px 0 12px"><i style="width:'+pct+'%"></i></div>'+
   '<div class="grid30">'+Array.from({length:30},function(_,k){ var j = k+1; return '<button class="juz" data-j="'+j+'" aria-pressed="'+(H.juz.indexOf(j)>-1)+'" aria-label="'+j+'. cüz">'+j+'</button>'; }).join("")+'</div>'+
   '<p class="mute" style="margin-top:10px">'+n+'/30 cüz okundu.</p>'+(n===30?'<p><b>Hatmin tamam oldu. Allah kabul etsin.</b></p>':'')+'<button class="btn ghost" id="nh" '+(n===30?'':'disabled')+'>Hatmi tamamla ve yenisine başla</button></div>';
  document.getElementById("nx").onclick = function(){ sp++; render(); };
  m.querySelectorAll("[data-j]").forEach(function(b){ b.onclick = function(){ var j = +b.dataset.j, x = H.juz.indexOf(j); if(x>-1) H.juz.splice(x,1); else H.juz.push(j); save(); render(); }; });
  document.getElementById("nh").onclick = function(){ H.count++; H.juz = []; save(); render(); };
}
